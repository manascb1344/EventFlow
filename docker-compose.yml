services:
  eventflow_db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - '5435:5432'
    volumes:
      - eventflow_postgres_data:/var/lib/postgresql/data
    networks:
      - eventflow_custom_bridge

networks:
  eventflow_custom_bridge:
    driver: bridge

volumes:
  eventflow_postgres_data:
    driver: local

# Postgres URL: postgres://postgres:postgres@localhost:5435/postgres
